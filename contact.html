<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — TuneZinc</title>
<meta name="description" content="Get in touch with the TuneZinc team." />
<link rel="icon" href="assets/logo/app_icon_32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>

<div id="nav-mount"></div>

<header class="hero team-hero" id="top">
  <div class="wrap">
    <div class="section-head reveal" style="margin: 0 auto;">
      <span class="eyebrow">Get in touch</span>
      <h1>Contact us</h1>
      <p>Questions, feedback, or just want to say hi? Send us a message and we'll get back to you.</p>
    </div>
  </div>
</header>

<section>
  <div class="wrap">
    <form class="contact-form reveal" action="https://formspree.io/f/myegwdww" method="POST">
      <div class="form-field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>

      <input type="text" name="_gotcha" style="display:none" aria-hidden="true" tabindex="-1" autocomplete="off">

      <button type="submit" class="btn btn-primary">Send message</button>
    </form>
  </div>
</section>

<div id="footer-mount"></div>

<script src="script.js"></script>
</body>
</html>
